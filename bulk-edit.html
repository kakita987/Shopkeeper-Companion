<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-transparent.png" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Sync Documentation — Shopkeeper Companion</title>
  </head>
  <body>
    <div id="app">
      <div class="app-layout">
        <main class="importer-shell">

          <header class="app-header">
            <div class="hero-copy">
              <h1>Shopkeeper Companion</h1>
            </div>

            <nav class="top-tabs" aria-label="Primary">
              <a class="top-tab" href="/#blueprints" data-view="blueprints">Blueprints</a>
              <a class="top-tab" href="/#saved-views" data-view="saved-views">Saved Views</a>
            </nav>

            <button id="settings-toggle" class="settings-toggle" type="button" aria-label="Open settings" aria-expanded="false" aria-controls="settings-panel">⚙</button>
          </header>

          <div class="view-shell">
            <article class="panel preview-panel privacy-panel">
              <div id="content-markdown"></div>
            </article>
          </div>

          <div id="docs-ad-banner" class="docs-ad-banner"></div>

          <footer class="site-footer-links" aria-label="Legal and project links">
            <a class="site-footer-link" href="/support.html">Support</a>
            <span class="site-footer-separator" aria-hidden="true">•</span>
            <a class="site-footer-link" href="/about.html">About</a>
            <span class="site-footer-separator" aria-hidden="true">•</span>
            <a class="site-footer-link" href="/privacy.html">Privacy Policy</a>
          </footer>

        </main>
      </div>
    </div>

    <aside id="settings-panel" class="settings-panel" aria-hidden="true">
      <div class="settings-card">
        <div class="settings-header">
          <h2 class="settings-title">Settings</h2>
          <button id="close-settings" class="close-settings" type="button" aria-label="Close settings">×</button>
        </div>

        <section class="settings-section">
          <h3>Theme</h3>
          <div class="theme-options">
            <label><input type="radio" name="theme" value="light" /> Light</label>
            <label><input type="radio" name="theme" value="dark" /> Dark</label>
            <label><input type="radio" name="theme" value="device" checked /> Device</label>
          </div>
        </section>

        <section class="settings-section">
          <h3>Font</h3>
          <select id="font-select" class="font-select" aria-label="Font style">
            <option value="default">Aesthetic (Default)</option>
            <option value="sans">Century Gothic</option>
            <option value="serif">Times New Roman</option>
          </select>
        </section>

      </div>
    </aside>

    <script type="module" src="/src/bulkEdit.js"></script>
  </body>
</html>
