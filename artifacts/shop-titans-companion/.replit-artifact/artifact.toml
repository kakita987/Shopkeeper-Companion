kind = "web"
previewPath = "/"
title = "Shopkeeper Companion"
version = "1.0.0"
id = "artifacts/shop-titans-companion"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19895

[services.development]
run = "pnpm --filter @workspace/shop-titans-companion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shop-titans-companion", "run", "build" ]
serve = "static"
publicDir = "artifacts/shop-titans-companion/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19895"
BASE_PATH = "/"
